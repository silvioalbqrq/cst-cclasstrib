name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  dados:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Sintaxe JS
        run: node --check assets/app.js
      - name: Regressão dos datasets
        run: python scripts/test_dados.py
